name: Balkano
description: "Balkano Market Place"
publish_to: "none"
version: 1.0.0+1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.jpg"

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_staggered_grid_view: ^0.7.0
  phosphoricons_flutter: ^1.0.0
  dotted_border: ^3.1.0
  flutter_svg: ^2.0.7
  provider: ^6.1.5+1
  image_picker: ^1.2.1
  supabase_flutter: ^2.12.0
  shared_preferences: ^2.5.4
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1

  path_provider: any
  http: any
  flutter_launcher_icons: ^0.14.4
  easy_localization: ^3.0.8
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
    - assets/icons/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
